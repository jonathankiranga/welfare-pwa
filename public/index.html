<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smarternow Welfare — Private</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230D47A1'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--primary:#0D47A1;--bg:#F1F5F9;--card:#fff;--text:#0F172A;--muted:#64748B;--border:#E2E8F0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:420px;width:100%;padding:32px;text-align:center}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#1976D2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;margin:0 auto 14px}
h1{margin:0;font-size:20px}
p{color:var(--muted);font-size:14px;margin:8px 0 0}
.btn{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:999px;background:var(--primary);color:#fff;text-decoration:none;font-weight:600;width:100%}
.btn:active{transform:scale(.98)}
.small{font-size:12px;color:var(--muted);margin-top:12px}
a{color:var(--primary)}
</style></head><body>
<div class="card">
  <div class="logo">S</div>
  <h1 id="title">Smarternow Welfare</h1>
  <p id="subtitle">Private System — Staff Access Only</p>
  <p id="message">This is a closed internal system for authorized staff. Please log in to manage groups and contacts.</p>
  <a class="btn" href="/admin/">Staff Portal →</a>
  <p class="small">welfare.smarternowapps.co.ke • <a href="/health">System Health</a></p>
</div>
<script>
fetch('/api/site-content').then(r=>r.json()).then(j=>{
  if(j.title) document.getElementById('title').textContent=j.title;
  if(j.subtitle) document.getElementById('subtitle').textContent=j.subtitle;
  if(j.message) document.getElementById('message').textContent=j.message;
}).catch(()=>{});
</script>
</body></html>
