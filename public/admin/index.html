<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welfare Admin — welfare.smarternowapps.co.ke</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230D47A1'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--primary:#0D47A1;--primary-dark:#002171;--accent:#00C853;--bg:#F5F7FA;--card:#fff;--text:#1A1A2E;--muted:#6B7280;--border:#E0E0E0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,var(--primary),#1976D2);color:#fff;padding:24px 20px}
.header h1{margin:0;font-size:22px}
.header p{margin:6px 0 0;opacity:.9}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin:16px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{border:1px solid var(--border);padding:8px;text-align:left;font-size:14px}th{background:#F5F7FA}
input,select{padding:10px;border:1px solid var(--border);border-radius:10px;margin:4px 0;width:100%;max-width:320px}
button{padding:8px 14px;border-radius:10px;border:0;background:var(--primary);color:#fff;cursor:pointer;font-weight:600}
button.outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.archived{opacity:.55}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#E3F2FD;color:var(--primary);font-size:11px}
@media(max-width:600px){table{font-size:12px}}
</style></head><body>
<div class="header">
  <h1>Welfare Admin </h1>
  <p>Source of truth for contacts/groups. Archive toggle (soft delete). <a href="/" style="color:#fff;text-decoration:underline">← Home</a></p>
</div>
<div class="container">
  <div class="card">
    <h3>Groups</h3>
    <input id="gName" placeholder="Group name (e.g. Customers - Nairobi)"/>
    <input id="gDesc" placeholder="Description"/>
    <button onclick="createGroup()">Add Group</button>
    <table id="groups"><tr><th>Name</th><th>Description</th><th>Archived</th><th>Actions</th></tr></table>
  </div>
  <div class="card">
    <h3>Contacts</h3>
    <input id="cName" placeholder="Name (e.g. Jane Wanjiku)"/>
    <input id="cPhone" placeholder="Phone +254..."/>
    <select id="cGroup"></select>
    <button onclick="createContact()">Add Contact</button>
    <table id="contacts"><tr><th>Name</th><th>Phone</th><th>Group</th><th>Archived</th><th>Actions</th></tr></table>
  </div>
  <div class="card">
    <h3>Device Binding</h3>
    <p id="deviceStatus">Loading…</p>
    <button class="outline" onclick="loadDevice()">Refresh</button>
  </div>
  <div class="card">
    <h3>Homepage Content (Editable)</h3>
    <p style="color:var(--muted);font-size:13px">Edit what shows on the closed homepage. Changes are live after Save.</p>
    <input id="hpTitle" placeholder="Title" style="width:100%"/>
    <input id="hpSubtitle" placeholder="Subtitle" style="width:100%"/>
    <textarea id="hpMessage" placeholder="Message" rows="3" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;margin:4px 0"></textarea>
    <button onclick="saveHomepage()">Save Homepage</button>
    <p id="hpStatus" style="font-size:12px;color:var(--muted)"></p>
  </div>
</div>
<script>
async function api(path, opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const r=await fetch(path,opts);
  const text=await r.text();
  if(!r.ok){
    if(text.includes('<!DOCTYPE')||text.includes('502')) throw new Error('Backend not ready — set TIDB_* env vars on Render and redeploy. ('+r.status+')');
    throw new Error(text);
  }
  try{ return JSON.parse(text); }catch(e){ throw new Error('Invalid JSON: '+text.slice(0,200)); }
}
async function load(){
  try{
    const data=await api('/api/contacts.json');
    const gSel=document.getElementById('cGroup'); gSel.innerHTML='';
    const gt=document.getElementById('groups');
    gt.innerHTML='<tr><th>Name</th><th>Description</th><th>Archived</th><th>Actions</th></tr>';
    data.groups.forEach(g=>{
      const tr=document.createElement('tr'); if(g.archived) tr.className='archived';
      tr.innerHTML=`<td>${g.name}</td><td>${g.description||''}</td><td>${g.archived?'Yes':''}</td><td><button onclick="toggleGroup('${g.remoteId}',${g.archived})">${g.archived?'Unarchive':'Archive'}</button></td>`;
      gt.appendChild(tr);
      const o=document.createElement('option'); o.value=g.remoteId; o.textContent=g.name; gSel.appendChild(o);
    });
    const ct=document.getElementById('contacts');
    ct.innerHTML='<tr><th>Name</th><th>Phone</th><th>Group</th><th>Archived</th><th>Actions</th></tr>';
    data.contacts.forEach(c=>{
      const tr=document.createElement('tr'); if(c.archived) tr.className='archived';
      const gName=(data.groups.find(g=>g.remoteId===c.groupRemoteId)||{}).name||'';
      tr.innerHTML=`<td>${c.name}</td><td>${c.phoneNumber}</td><td>${gName}</td><td>${c.archived?'Yes':''}</td><td><button onclick="toggleContact('${c.remoteId}',${c.archived})">${c.archived?'Unarchive':'Archive'}</button></td>`;
      ct.appendChild(tr);
    });
  }catch(e){ document.body.innerHTML+='<p style="color:#B71C1C;padding:16px;background:#FFEBEE;border-radius:12px">Load failed: '+e.message+'</p>';}
}
async function createGroup(){
  const name=document.getElementById('gName').value.trim(), desc=document.getElementById('gDesc').value.trim();
  if(!name) return alert('Name required');
  try{ await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[{remoteId:crypto.randomUUID(),name,description:desc,updatedAt:Date.now(),archived:0}], contacts:[]})}); load(); }catch(e){ alert('Failed: '+e.message); }
}
async function createContact(){
  const name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim(), gr=document.getElementById('cGroup').value;
  if(!name||!phone) return alert('Name/phone required');
  try{ await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[], contacts:[{remoteId:crypto.randomUUID(),name,phoneNumber:phone,groupRemoteId:gr,updatedAt:Date.now(),archived:0}]})}); load(); }catch(e){ alert('Failed: '+e.message); }
}
async function toggleGroup(id,arch){ try{ await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[{remoteId:id, archived: arch?0:1, updatedAt:Date.now()}], contacts:[]})}); load(); }catch(e){ alert('Failed: '+e.message); } }
async function toggleContact(id,arch){ try{ await api('/api/contacts/archive',{method:'POST',body:JSON.stringify({remoteIds:[id], archived:!arch})}); load(); }catch(e){ alert('Failed: '+e.message); } }
async function loadDevice(){
  try{
    const r=await api('/api/device/status'); document.getElementById('deviceStatus').innerText=JSON.stringify(r);
  }catch(e){ document.getElementById('deviceStatus').innerText='Device status: '+e.message; }
}
async function loadHomepageEditor(){
  try{
    const j=await api('/api/site-content');
    document.getElementById('hpTitle').value=j.title||'';
    document.getElementById('hpSubtitle').value=j.subtitle||'';
    document.getElementById('hpMessage').value=j.message||'';
  }catch(e){}
}
async function saveHomepage(){
  const title=document.getElementById('hpTitle').value.trim(), subtitle=document.getElementById('hpSubtitle').value.trim(), message=document.getElementById('hpMessage').value.trim();
  if(!title) return alert('Title required');
  await api('/api/site-content',{method:'POST',body:JSON.stringify({title,subtitle,message})});
  document.getElementById('hpStatus').textContent='Saved — homepage updated';
  setTimeout(()=>document.getElementById('hpStatus').textContent='',2000);
}
load(); loadHomepageEditor();
</script></body></html>
