<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Welfare Admin — welfare.smarternowapps.co.ke</title><style>body{font-family:system-ui;padding:20px;max-width:900px;margin:auto}h1{color:#0D47A1}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f5f5f5}button{padding:6px 12px;margin:2px}input,select{padding:6px;margin:2px}.archived{opacity:0.5}</style></head><body>
<h1>Welfare Admin — welfare.smarternowapps.co.ke</h1>
<p>Source of truth for contacts/groups. Archive toggle (soft delete). Android is one device lock; PWA can archive.</p>
<div>
<h3>Groups</h3>
<input id="gName" placeholder="Group name (e.g. Customers - Nairobi)"/>
<input id="gDesc" placeholder="Description"/>
<button onclick="createGroup()">Add Group</button>
<table id="groups"><tr><th>Name</th><th>Contacts</th><th>Archived</th><th>Actions</th></tr></table>
</div>
<div>
<h3>Contacts</h3>
<input id="cName" placeholder="Name (e.g. Jane Wanjiku)"/>
<input id="cPhone" placeholder="Phone +254..."/>
<select id="cGroup"></select>
<button onclick="createContact()">Add Contact</button>
<table id="contacts"><tr><th>Name</th><th>Phone</th><th>Group</th><th>Archived</th><th>Actions</th></tr></table>
</div>
<div>
<h3>Device Binding</h3>
<p id="deviceStatus">Loading…</p>
<button onclick="loadDevice()">Refresh</button>
</div>
<script>
const API=''; // same origin, uses X-API-Key header from prompt
let apiKey=localStorage.getItem('pwa_api_key')||prompt('Enter PWA API Key');
if(apiKey) localStorage.setItem('pwa_api_key',apiKey);
async function api(path, opts={}){
  opts.headers=Object.assign({'X-API-Key':apiKey,'X-Device-Token':localStorage.getItem('device_token')||apiKey,'Content-Type':'application/json'}, opts.headers||{});
  const r=await fetch(path,opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function load(){
  try{
    const data=await api('/api/contacts.json');
    const gSel=document.getElementById('cGroup'); gSel.innerHTML='';
    const gt=document.getElementById('groups');
    gt.innerHTML='<tr><th>Name</th><th>Contacts</th><th>Archived</th><th>Actions</th></tr>';
    data.groups.forEach(g=>{
      const tr=document.createElement('tr'); if(g.archived) tr.className='archived';
      tr.innerHTML=`<td>${g.name}</td><td>${g.description||''}</td><td>${g.archived?'Yes':''}</td><td><button onclick="toggleGroup('${g.remoteId}',${g.archived})">${g.archived?'Unarchive':'Archive'}</button></td>`;
      gt.appendChild(tr);
      const o=document.createElement('option'); o.value=g.remoteId; o.textContent=g.name; gSel.appendChild(o);
    });
    const ct=document.getElementById('contacts');
    ct.innerHTML='<tr><th>Name</th><th>Phone</th><th>Group</th><th>Archived</th><th>Actions</th></tr>';
    data.contacts.forEach(c=>{
      const tr=document.createElement('tr'); if(c.archived) tr.className='archived';
      const gName=(data.groups.find(g=>g.remoteId===c.groupRemoteId)||{}).name||'';
      tr.innerHTML=`<td>${c.name}</td><td>${c.phoneNumber}</td><td>${gName}</td><td>${c.archived?'Yes':''}</td><td><button onclick="toggleContact('${c.remoteId}',${c.archived})">${c.archived?'Unarchive':'Archive'}</button></td>`;
      ct.appendChild(tr);
    });
  }catch(e){ document.body.innerHTML+='<p style=color:red>Load failed: '+e.message+'</p>';}
}
async function createGroup(){
  const name=document.getElementById('gName').value.trim(), desc=document.getElementById('gDesc').value.trim();
  if(!name) return alert('Name required');
  await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[{remoteId:crypto.randomUUID(),name,description:desc,updatedAt:Date.now(),archived:0}], contacts:[]})});
  load();
}
async function createContact(){
  const name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim(), gr=document.getElementById('cGroup').value;
  if(!name||!phone) return alert('Name/phone required');
  await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[], contacts:[{remoteId:crypto.randomUUID(),name,phoneNumber:phone,groupRemoteId:gr,updatedAt:Date.now(),archived:0}]})});
  load();
}
async function toggleGroup(id,arch){ await api('/api/contacts/upsert',{method:'POST',body:JSON.stringify({groups:[{remoteId:id, archived: arch?0:1, updatedAt:Date.now()}], contacts:[]})}); load(); }
async function toggleContact(id,arch){ await api('/api/contacts/archive',{method:'POST',body:JSON.stringify({remoteIds:[id], archived:!arch})}); load(); }
async function loadDevice(){
  try{
    const r=await api('/api/device/status'); document.getElementById('deviceStatus').innerText=JSON.stringify(r);
  }catch(e){ document.getElementById('deviceStatus').innerText='Device status: '+e.message; }
}
load();
</script></body></html>
